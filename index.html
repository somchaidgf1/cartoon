<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>AR Cartoon TV</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;

      background: rgba(0,0,0,0.7);
      color: white;

      padding: 10px 18px;
      border-radius: 12px;

      font-size: 15px;
    }

    #controls {
      position: fixed;

      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 1000;

      display: flex;
      gap: 10px;

      width: 95%;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 14px;

      padding: 14px 18px;

      font-size: 16px;
      font-weight: bold;

      color: white;
      background: rgba(0,90,210,0.95);

      box-shadow: 0 4px 10px rgba(0,0,0,0.3);

      cursor: pointer;
    }

    button:active {
      transform: scale(0.94);
    }

    #powerBtn.off {
      background: #d32f2f;
    }

    #powerBtn.on {
      background: #16a34a;
    }

  </style>


<script>

/* ================================
   ตรวจจับ Hiro Marker
================================ */

AFRAME.registerComponent(
  "marker-handler",
  {

    init: function() {

      const status =
        document.getElementById("status");

      this.el.addEventListener(
        "markerFound",
        function() {

          status.innerHTML =
            "📺 พบ Hiro Marker — Smart TV";

          status.style.color =
            "#7CFF8A";

        }
      );


      this.el.addEventListener(
        "markerLost",
        function() {

          status.innerHTML =
            "🔎 กรุณาส่องกล้องไปที่ Hiro Marker";

          status.style.color =
            "white";

        }
      );

    }

  }
);

</script>

</head>


<body>


<div id="status">
  🔎 กรุณาส่องกล้องไปที่ Hiro Marker
</div>



<div id="controls">

  <button
    id="powerBtn"
    class="off"
    onclick="toggleTV()">

    ⏻ เปิด TV

  </button>


  <button onclick="brightnessUp()">
    ☀️ เพิ่มแสง
  </button>


  <button onclick="brightnessDown()">
    🌙 ลดแสง
  </button>

</div>



<a-scene

  embedded

  vr-mode-ui="enabled:false"

  renderer="
    antialias:true;
    logarithmicDepthBuffer:true;
  "

  arjs="
    sourceType:webcam;
    debugUIEnabled:false;
    detectionMode:mono;
  ">


  <!-- Light -->

  <a-entity
    light="type:ambient; intensity:1.3">
  </a-entity>


  <a-marker
    preset="hiro"
    marker-handler>


    <!-- TV -->

    <a-entity

      id="tv"

      position="0 0.7 0"

      rotation="-90 0 0"

      scale="0.9 0.9 0.9">


      <!-- TV BODY -->

      <a-box

        position="0 0 0"

        width="1.75"

        height="1"

        depth="0.10"

        color="#101010">

      </a-box>



      <!-- =================================== -->
      <!-- CARTOON SCREEN -->
      <!-- =================================== -->

      <a-entity id="cartoonScreen">


        <!-- SKY -->

        <a-plane

          position="0 0 0.056"

          width="1.55"

          height="0.80"

          color="#69C8FF">

        </a-plane>



        <!-- GROUND -->

        <a-plane

          position="0 -0.31 0.060"

          width="1.55"

          height="0.18"

          color="#62C554">

        </a-plane>



        <!-- SUN -->

        <a-circle

          position="0.55 0.23 0.065"

          radius="0.10"

          color="#FFD600"

          animation="
            property:scale;
            from:1 1 1;
            to:1.2 1.2 1.2;
            dir:alternate;
            dur:1000;
            loop:true;
          ">

        </a-circle>



        <!-- CLOUD 1 -->

        <a-entity

          animation="
            property:position;
            from:-0.9 0.20 0.07;
            to:0.9 0.20 0.07;
            dur:6000;
            loop:true;
            easing:linear;
          ">


          <a-circle
            position="-0.05 0 0"
            radius="0.08"
            color="white">
          </a-circle>


          <a-circle
            position="0.04 0.03 0"
            radius="0.11"
            color="white">
          </a-circle>


          <a-circle
            position="0.14 0 0"
            radius="0.08"
            color="white">
          </a-circle>

        </a-entity>



        <!-- CLOUD 2 -->

        <a-entity

          animation="
            property:position;
            from:0.8 0.05 0.07;
            to:-0.9 0.05 0.07;
            dur:8500;
            loop:true;
            easing:linear;
          ">


          <a-circle
            position="-0.05 0 0"
            radius="0.06"
            color="white">
          </a-circle>


          <a-circle
            position="0.03 0.025 0"
            radius="0.08"
            color="white">
          </a-circle>


          <a-circle
            position="0.11 0 0"
            radius="0.06"
            color="white">
          </a-circle>

        </a-entity>



        <!-- ================================= -->
        <!-- CARTOON CHARACTER -->
        <!-- ================================= -->

        <a-entity

          id="character"

          position="-0.45 -0.20 0.08"

          animation="
            property:position;
            from:-0.50 -0.20 0.08;
            to:0.50 -0.20 0.08;
            dur:4000;
            dir:alternate;
            loop:true;
            easing:easeInOutQuad;
          ">


          <!-- Body -->

          <a-circle

            position="0 0 0"

            radius="0.15"

            color="#FF9800"

            animation="
              property:position;
              from:0 0 0;
              to:0 0.10 0;
              dur:500;
              dir:alternate;
              loop:true;
            ">

          </a-circle>



          <!-- LEFT EYE -->

          <a-circle

            position="-0.05 0.045 0.01"

            radius="0.025"

            color="#FFFFFF">

          </a-circle>


          <a-circle

            position="-0.05 0.045 0.02"

            radius="0.012"

            color="#000000">

          </a-circle>



          <!-- RIGHT EYE -->

          <a-circle

            position="0.05 0.045 0.01"

            radius="0.025"

            color="#FFFFFF">

          </a-circle>


          <a-circle

            position="0.05 0.045 0.02"

            radius="0.012"

            color="#000000">

          </a-circle>



          <!-- SMILE -->

          <a-ring

            position="0 -0.025 0.02"

            radius-inner="0.038"

            radius-outer="0.045"

            theta-start="180"

            theta-length="180"

            color="#222222">

          </a-ring>


          <!-- LEFT LEG -->

          <a-box

            position="-0.06 -0.18 0"

            width="0.04"

            height="0.10"

            depth="0.02"

            color="#3949AB"

            animation="
              property:rotation;
              from:0 0 -25;
              to:0 0 25;
              dur:300;
              dir:alternate;
              loop:true;
            ">

          </a-box>


          <!-- RIGHT LEG -->

          <a-box

            position="0.06 -0.18 0"

            width="0.04"

            height="0.10"

            depth="0.02"

            color="#3949AB"

            animation="
              property:rotation;
              from:0 0 25;
              to:0 0 -25;
              dur:300;
              dir:alternate;
              loop:true;
            ">

          </a-box>


        </a-entity>



        <!-- CARTOON TEXT -->

        <a-text

          value="HELLO AR!"

          position="0 0.30 0.08"

          align="center"

          width="0.8"

          color="#FFFFFF"

          animation="
            property:scale;
            from:1 1 1;
            to:1.15 1.15 1.15;
            dur:800;
            dir:alternate;
            loop:true;
          ">

        </a-text>



      </a-entity>



      <!-- =================================== -->
      <!-- BRIGHTNESS LAYER -->
      <!-- =================================== -->

      <a-plane

        id="brightness"

        position="0 0 0.09"

        width="1.55"

        height="0.80"

        material="
          color:black;
          opacity:0;
          transparent:true;
          depthTest:false;
        ">

      </a-plane>



      <!-- =================================== -->
      <!-- TV OFF SCREEN -->
      <!-- =================================== -->

      <a-plane

        id="offScreen"

        position="0 0 0.10"

        width="1.55"

        height="0.80"

        color="#010101"

        visible="true">

      </a-plane>



      <!-- BRAND -->

      <a-text

        value="AR SMART TV"

        position="0 -0.46 0.075"

        align="center"

        width="1.3"

        color="#CCCCCC">

      </a-text>



      <!-- POWER LIGHT -->

      <a-sphere

        id="powerLED"

        position="0.70 -0.43 0.075"

        radius="0.018"

        color="#FF0000">

      </a-sphere>



      <!-- TV NECK -->

      <a-box

        position="0 -0.60 -0.02"

        width="0.12"

        height="0.25"

        depth="0.10"

        color="#333333">

      </a-box>



      <!-- TV BASE -->

      <a-box

        position="0 -0.74 -0.02"

        width="0.65"

        height="0.06"

        depth="0.25"

        color="#222222">

      </a-box>


    </a-entity>


  </a-marker>


  <a-entity camera></a-entity>


</a-scene>



<script>


let tvOn = false;


/*
ค่า darkness

0   = สว่างมาก
0.8 = มืดมาก
*/

let darkness = 0;



/* ===========================
   เปิด / ปิด TV
=========================== */

function toggleTV() {


  tvOn = !tvOn;


  const screen =
    document.getElementById("offScreen");


  const led =
    document.getElementById("powerLED");


  const button =
    document.getElementById("powerBtn");



  if(tvOn) {


    screen.setAttribute(
      "visible",
      false
    );


    led.setAttribute(
      "color",
      "#00FF55"
    );


    button.innerHTML =
      "⏻ ปิด TV";


    button.classList.remove("off");

    button.classList.add("on");


  }

  else {


    screen.setAttribute(
      "visible",
      true
    );


    led.setAttribute(
      "color",
      "#FF0000"
    );


    button.innerHTML =
      "⏻ เปิด TV";


    button.classList.remove("on");

    button.classList.add("off");


  }

}



/* ===========================
   เพิ่มความสว่าง
=========================== */

function brightnessUp() {


  if(!tvOn) return;


  darkness -= 0.15;


  if(darkness < 0) {

    darkness = 0;

  }


  updateBrightness();

}



/* ===========================
   ลดความสว่าง
=========================== */

function brightnessDown() {


  if(!tvOn) return;


  darkness += 0.15;


  if(darkness > 0.75) {

    darkness = 0.75;

  }


  updateBrightness();

}



/* ===========================
   Update Brightness
=========================== */

function updateBrightness() {


  const screen =
    document.getElementById(
      "brightness"
    );


  screen.setAttribute(

    "material",

    "color:black;" +
    "opacity:" + darkness + ";" +
    "transparent:true;" +
    "depthTest:false;"

  );

}


</script>


</body>

</html>
